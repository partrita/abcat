[project]
name = "abmap"
version = "0.1.0"
description = "Antibody V-domain CDR analysis (via ANARCII) and Constant region Isotype/Subclass/Allotype classification tool"
readme = "README.md"
authors = [
    { name = "deepthought", email = "deepthought@postech.ac.kr" }
]
requires-python = ">=3.14"
dependencies = [
    "anarcii>=0.1.0",
    "biopython>=1.80",
    "pydantic>=2.0.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.scripts]
abmap = "abmap.cli:app"

[build-system]
requires = ["uv_build>=0.11.30,<0.12.0"]
build-backend = "uv_build"
